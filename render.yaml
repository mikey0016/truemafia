# Render Blueprint — truemafia (Telegram Mafia game)
# Deploy: Render dashboard → New → Blueprint → shu repoga ulash
services:
  - type: web
    name: truemafia
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Without DB_CLIENT=postgres the server treats DATABASE_URL as a SQLite file path.
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string
      - key: BOT_TOKEN
        sync: false # Telegram bot token (/start javobi + initData tekshiruvi)
      - key: WEBAPP_URL
        value: https://mikey0016.github.io/truemafia/ # /start dagi O'ynash tugmasi
      - key: ADMIN_IDS
        sync: false # vergul bilan ajratilgan admin Telegram ID'lari
