name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 https://truemafia-gwgv.onrender.com/api/health)
          echo "health=$code"
          test "$code" = "200"
