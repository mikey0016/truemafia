# fly.io configuration for true-mafia
app = "truemafia"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # SQLite fayli volume'da saqlanadi
  DATABASE_URL = "/data/true-mafia.sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  # WebSocket o'yin serveri — mashina o'chib qolmasin
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
